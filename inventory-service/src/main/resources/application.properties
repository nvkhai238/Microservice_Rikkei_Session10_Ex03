spring.application.name=inventory-service
server.port=${SERVER_PORT:8091}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.rikkei.pharmacyservice.event.OrderEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.rikkei.pharmacyservice.event
pharmacy.kafka.stock-topic=medicine-stock-events
spring.datasource.url=${PHARMACY_DB_URL:jdbc:postgresql://localhost:5433/pharmacy_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
